<!DOCTYPE html>
<html>
<head>
    <title>WebView Example</title>
    <style>
        /* Tùy chỉnh kích thước và kiểu dáng của iframe */
        iframe {
            width: 100%; /* Chiều rộng 100% của trang */
            height: 600px; /* Chiều cao cố định hoặc tùy chỉnh */
            border: none; /* Loại bỏ đường viền */
        }
    </style>
</head>
<body>
    <iframe src="https://jh.id.vn"></iframe>
</body>
</html>
